<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nahush Shrivatsa</title>
<link rel="icon" type="image/jpeg" href="./logo.jpg" />
<script>
  /* Runs before first paint. React here is compiled by Babel in the browser,
     which takes long enough that setting the mode in JS would flash dark. */
  (function () {
    var m;
    try { m = localStorage.getItem('nahush.mode'); } catch (e) {}
    /* Light is the default; the OS preference is deliberately not consulted.
       Only an explicit toggle switches it. */
    if (m !== 'light' && m !== 'dark') m = 'light';
    document.documentElement.setAttribute('data-mode', m);
  })();
</script>
<link rel="stylesheet" href="./colors_and_type.css" />
<style>
  /* =================================================================
     Page chrome
     ================================================================= */
  html, body { background: var(--bg); }
  body { min-height: 100vh; }
  #root { min-height: 100vh; }

  /* Ease the mode flip. Scoped to the colour properties only — a blanket
     transition would drag every hover state with it. */
  body, .nav, .edu-card, .proj-card, .xp-row, .photo-frame, .logo-tile {
    transition: background-color var(--dur-base) var(--ease),
                border-color var(--dur-base) var(--ease),
                color var(--dur-base) var(--ease);
  }

  /* Layout ---------------------------------------------------------- */
  .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
  .container.narrow { max-width: 820px; }
  .section { padding: 30px 0; }
  /* Extra breathing room where the hero hands off to the first section.
     The id outranks .section, so no !important needed. */
  #education { padding-top: 40px; }
  @media (max-width: 720px) {
    .container { padding: 0 20px; }
    .section { padding: 36px 0; }
    #education { padding-top: 40px; }
  }

  /* Nav ------------------------------------------------------------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    height: var(--nav-h);
    backdrop-filter: blur(12px);
    background: var(--nav-bg);
    border-bottom: 1px solid transparent;
    transition: border-color var(--dur-base) var(--ease);
  }
  .nav.scrolled { border-bottom-color: var(--border-1); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 100%; }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-sans); font-weight: 500; font-size: 17px;
    color: var(--fg-1); text-decoration: none; cursor: pointer;
  }
  .brand-logo {
    width: 26px; height: 26px; object-fit: contain; filter: invert(1);
    transition: transform var(--dur-fast) var(--ease);
  }
  /* Source artwork is dark-on-light, so light mode wants it uninverted. */
  :root[data-mode="light"] .brand-logo { filter: none; }
  .brand:hover .brand-logo { transform: rotate(45deg); }
  .brand-text { display: inline-flex; align-items: baseline; }
  .brand .dot { color: var(--accent); }
  .nav-links { display: flex; gap: 26px; }
  .nav-links a {
    font-family: var(--font-mono); font-size: 14px; color: var(--fg-2);
    text-decoration: none; cursor: pointer; position: relative;
    transition: color var(--dur-fast) var(--ease);
  }
  .nav-links a:hover, .nav-links a.active { color: var(--fg-1); }
  .nav-links a.active::before { content: '/ '; color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 26px; }

  /* Light / dark toggle ---------------------------------------------- */
  .mode-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0;
    background: transparent; border: 1px solid var(--border-1);
    border-radius: var(--radius-sm); color: var(--fg-2); cursor: pointer;
    transition: color var(--dur-fast) var(--ease),
                border-color var(--dur-fast) var(--ease);
  }
  .mode-toggle:hover { color: var(--fg-1); border-color: var(--border-3); }
  .mode-toggle svg { width: 15px; height: 15px; display: block; }

  @media (max-width: 640px) {
    .nav-links { gap: 16px; }
    .nav-links a { font-size: 13px; }
    .nav-right { gap: 14px; }
  }

  /* Buttons --------------------------------------------------------- */
  .btn {
    font-family: var(--font-sans); font-weight: 500; font-size: 15px;
    padding: 11px 20px; border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid transparent; transition: all var(--dur-fast) var(--ease);
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--fg-1); color: var(--bg); }
  .btn-primary:hover { background: var(--accent); }
  .btn-ghost { background: transparent; color: var(--fg-1); border-color: var(--border-2); }
  .btn-ghost:hover { border-color: var(--fg-1); }
  kbd {
    font-family: var(--font-mono); font-size: 12px; padding: 1px 6px;
    background: var(--surface-2); border: 1px solid var(--border-1);
    border-bottom-width: 2px; border-radius: 3px; color: var(--fg-1);
  }

  /* =================================================================
     Hero
     ================================================================= */
  .hero { padding-top: 40px; padding-bottom: 52px; position: relative; }
  .hero-glow {
    position: absolute; top: -220px; left: -300px;
    width: 820px; height: 820px; pointer-events: none;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
    opacity: 0.09;
  }
  :root[data-mode="light"] .hero-glow {
    opacity: 0.055;
  }
  .hero-grid {
    display: grid; grid-template-columns: 1fr 340px;
    gap: 56px; align-items: center; position: relative;
  }
  .hero-left { min-width: 0; }
  @media (max-width: 900px) {
    .hero { padding-top: 30px; padding-bottom: 40px; }
    .hero-grid { grid-template-columns: 1fr; gap: 36px; }
    .hero-right { max-width: 260px; }
  }

  .hero-boot {
    font-family: var(--font-mono); font-size: 14px;
    color: var(--fg-2); line-height: 1.75;
    margin-bottom: 18px; min-height: 68px; padding-left: 14px;
  }
  .boot-line { white-space: pre; }
  .boot-line.is-cmd { color: var(--fg-1); }
  .boot-line.is-cmd::before { content: '$ '; color: var(--accent); margin-left: -14px; }
  .caret {
    display: inline-block; width: 0.55ch; background: var(--fg-1); color: transparent;
    animation: blink 1.05s steps(2) infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  .hero-name {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(2.6rem, 6vw, 4.75rem); line-height: 1.08; letter-spacing: -0.02em;
    color: var(--fg-1); margin: 0; padding-bottom: 0.12em;
  }
  .hero-name .em { font-style: italic; }
  .hero-name .cursor {
    display: inline-block; width: 0.5ch; height: 0.8em; background: var(--accent);
    vertical-align: -0.04em; margin-left: 6px; animation: blink 1.05s steps(2) infinite;
  }
  .hero-sub {
    font-size: 19.5px; color: var(--fg-2); max-width: 46ch;
    line-height: 1.6; margin: 16px 0 22px;
  }
  .hero-sub .acc { color: var(--accent); }
  .hero-ctas { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .hero-hint { font-family: var(--font-mono); font-size: 13px; color: var(--fg-3); margin-left: 4px; }

  /* Fade-up once the boot sequence finishes -------------------------- */
  .hero-name, .hero-sub, .hero-ctas, .hero-right {
    opacity: 0; transform: translateY(8px);
    transition: opacity 420ms var(--ease), transform 420ms var(--ease);
  }
  .hero-name.in  { opacity: 1; transform: none; transition-delay: 0ms; }
  .hero-sub.in   { opacity: 1; transform: none; transition-delay: 90ms; }
  .hero-ctas.in  { opacity: 1; transform: none; transition-delay: 180ms; }
  .hero-right.in { opacity: 1; transform: none; transition-delay: 130ms; }
  @media (prefers-reduced-motion: reduce) {
    .hero-name, .hero-sub, .hero-ctas, .hero-right { opacity: 1; transform: none; }
    .hero-name .cursor, .caret { animation: none; }
  }

  /* Photo — framed as a terminal window ------------------------------ */
  .photo-frame {
    margin: 0; border: 1px solid var(--border-2); border-radius: 10px;
    overflow: hidden; background: var(--surface-1);
    box-shadow: var(--shadow-lift);
  }
  .photo-head {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px; background: var(--surface-2);
    border-bottom: 1px solid var(--border-1);
  }
  .photo-dots { display: flex; gap: 6px; }
  .photo-dots span { width: 10px; height: 10px; border-radius: 999px; display: block; }
  .photo-title {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--fg-3); letter-spacing: 0.02em;
  }
  .photo-body {
    aspect-ratio: 5 / 7; background: var(--surface-1);
    display: flex; align-items: center; justify-content: center;
  }
  .photo-body img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(0.88) contrast(1.03);
  }
  .photo-fallback {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--fg-3);
    text-align: center; line-height: 2; padding: 20px;
  }
  .photo-fallback .pf-err { color: var(--hot); margin-bottom: 6px; }
  .photo-fallback .pf-key { color: var(--fg-1); }

  /* =================================================================
     Section header — one command line, everywhere
     ================================================================= */
  .section-head {
    display: flex; align-items: baseline; gap: 10px;
    font-family: var(--font-mono); font-size: 14px;
    padding-bottom: 11px; margin-bottom: 22px;
    border-bottom: 1px solid var(--border-1);
  }
  .sh-prompt { color: var(--accent); }
  /* h2 for document outline — reset the global heading styles back to mono. */
  .sh-text {
    font-family: var(--font-mono); font-size: 14px; font-weight: 400;
    color: var(--fg-1); letter-spacing: 0.01em; margin: 0; line-height: 1.4;
  }
  .sh-num { margin-left: auto; font-size: 12px; color: var(--fg-3); }

  /* =================================================================
     Brand tile — shared by education cards and the experience rail
     ================================================================= */
  .logo-tile {
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-3); border: 1px solid var(--border-2);
    border-radius: 10px; overflow: hidden; flex-shrink: 0;
  }
  .logo-tile img { width: 100%; height: 100%; object-fit: contain; padding: 14%; display: block; }
  .logo-mark {
    font-family: var(--font-mono); font-weight: 500; color: var(--fg-2);
    letter-spacing: 0.04em; line-height: 1; user-select: none;
  }

  /* =================================================================
     Education
     ================================================================= */
  .edu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .edu-grid { grid-template-columns: 1fr; } }
  .edu-card {
    background: var(--surface-1); border: 1px solid var(--border-1);
    border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color var(--dur-base) var(--ease),
                background var(--dur-base) var(--ease),
                transform var(--dur-base) var(--ease);
  }
  .edu-card:hover {
    border-color: var(--border-2); background: var(--surface-2); transform: translateY(-2px);
  }

  /* Banner: image if present, otherwise a designed gradient. */
  .edu-banner {
    position: relative; aspect-ratio: 3 / 1;
    background:
      radial-gradient(120% 140% at 12% 0%, var(--accent-soft) 0%, transparent 58%),
      linear-gradient(145deg, var(--surface-3) 0%, var(--surface-1) 100%);
    border-bottom: 1px solid var(--border-1);
  }
  .edu-banner img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(0.8) brightness(0.78);
  }
  /* Scrim keeps the tile legible over any photo. */
  .edu-banner::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(var(--scrim-rgb), 0.85) 0%, rgba(var(--scrim-rgb), 0.15) 55%, transparent 100%);
  }
  .edu-logo {
    position: absolute; z-index: 1; left: 24px; bottom: -22px;
    width: 56px; height: 56px; border-radius: 12px;
    background: var(--surface-2);
    box-shadow: var(--shadow-tile);
  }
  .edu-logo .logo-mark { font-size: 16px; color: var(--fg-1); }

  .edu-body { padding: 30px 22px 20px; display: flex; flex-direction: column; flex: 1; }
  .edu-degree {
    font-family: var(--font-sans); font-weight: 500; font-size: 20.5px;
    color: var(--fg-1); margin: 0 0 4px; letter-spacing: -0.015em; line-height: 1.3;
  }
  .edu-school { font-size: 15.5px; color: var(--accent); }
  .edu-meta {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--fg-3);
    margin-top: 9px; letter-spacing: 0.02em;
  }
  .edu-meta .edu-dot { margin: 0 7px; color: var(--border-2); }

  .edu-did {
    font-size: 14.5px; color: var(--fg-2); line-height: 1.7;
    margin: 13px 0 0; padding-top: 12px; border-top: 1px solid var(--border-1);
  }

  /* =================================================================
     Experience — year gutter + ruled rows
     ================================================================= */
  .xp {
    list-style: none; margin: 0; padding: 0;
    border-top: 1px solid var(--border-1);
  }
  .xp-row {
    position: relative;
    display: grid; grid-template-columns: 136px 1fr; column-gap: 28px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border-1);
    transition: background var(--dur-fast) var(--ease);
  }
  /* Accent bar rides in the container gutter — no layout shift on hover. */
  .xp-row::before {
    content: ''; position: absolute;
    left: -16px; top: -1px; bottom: -1px; width: 2px;
    background: var(--accent); opacity: 0;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .xp-row:hover::before { opacity: 1; }
  .xp-row:hover { background: var(--row-hover); }
  .xp-row.is-current::before { opacity: 0.32; }

  .xp-when {
    display: flex; flex-direction: column; align-items: flex-start; gap: 9px;
    padding-top: 3px;
  }
  .xp-year {
    font-family: var(--font-mono); font-size: 13px; color: var(--fg-2);
    letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
  }
  /* Quiet status chip — no glow, no pulse. */
  .xp-chip {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--success);
    border: 1px solid color-mix(in srgb, var(--success) 34%, transparent);
    background: color-mix(in srgb, var(--success) 9%, transparent);
    border-radius: 999px; padding: 2.5px 9px; line-height: 1.4;
  }

  .xp-body { min-width: 0; }
  .xp-role {
    font-family: var(--font-sans); font-weight: 500; font-size: 19px;
    color: var(--fg-1); margin: 0 0 4px; letter-spacing: -0.015em; line-height: 1.3;
  }
  .xp-meta { font-size: 14.5px; margin-bottom: 9px; }
  .xp-co { color: var(--accent); }
  .xp-sep { color: var(--border-2); margin: 0 8px; }
  .xp-loc { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg-3); }
  /* Uncapped so descriptions run the full row and land on two lines.
     The 1200px container is what bounds the measure. */
  .xp-desc { font-size: 14.5px; color: var(--fg-2); line-height: 1.68; margin: 0; max-width: 85%; }

  .xp-more { margin-top: 16px; }
  .xp-more button {
    font-family: var(--font-sans); font-size: 14px; font-weight: 500; color: var(--fg-2);
    background: transparent; border: 1px solid var(--border-2);
    border-radius: var(--radius-sm); padding: 8px 16px; cursor: pointer;
    transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
  }
  .xp-more button:hover { color: var(--fg-1); border-color: var(--fg-3); }

  @media (max-width: 720px) {
    .xp-row { grid-template-columns: 1fr; row-gap: 10px; padding: 18px 0; }
    .xp-when { flex-direction: row; align-items: center; gap: 10px; padding-top: 0; }
    .xp-role { font-size: 17.5px; }
  }

  /* =================================================================
     Projects
     ================================================================= */
  .proj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) { .proj-grid { grid-template-columns: 1fr; } }
  .proj-card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--surface-1); border: 1px solid var(--border-1);
    border-radius: var(--radius-md); padding: 22px 24px;
    color: inherit; text-decoration: none;
    transition: border-color var(--dur-fast) var(--ease),
                background var(--dur-fast) var(--ease),
                transform var(--dur-fast) var(--ease);
  }
  a.proj-card { cursor: pointer; }
  a.proj-card:hover {
    border-color: var(--border-2); background: var(--surface-2); transform: translateY(-2px);
  }
  a.proj-card:hover .proj-title { color: var(--accent); }
  a.proj-card:hover .proj-ext { opacity: 1; transform: none; }
  .proj-card.is-private { opacity: 0.86; }
  .proj-top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .proj-name { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .proj-title {
    font-family: var(--font-sans); font-weight: 500; font-size: 19px;
    color: var(--fg-1); margin: 0; letter-spacing: -0.014em; line-height: 1.3;
    transition: color var(--dur-fast) var(--ease);
  }
  .proj-ext {
    font-family: var(--font-mono); font-size: 13px; color: var(--accent);
    opacity: 0; transform: translate(-3px, 3px);
    transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  }
  .proj-badge {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3);
    border: 1px solid var(--border-1); border-radius: 999px; padding: 2px 8px;
    letter-spacing: 0.05em; white-space: nowrap;
  }
  .proj-year { font-family: var(--font-mono); font-size: 12px; color: var(--fg-3); white-space: nowrap; }
  .proj-desc { font-size: 14.5px; color: var(--fg-2); line-height: 1.7; margin: 0; flex: 1; }
  .proj-tags {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--fg-3); letter-spacing: 0.02em;
  }
  .proj-tags .pt-sep { color: var(--border-2); margin: 0 6px; }

  /* =================================================================
     Contact
     ================================================================= */
  .contact { padding-bottom: 56px; }
  .contact-line {
    font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 1.14; letter-spacing: -0.01em; color: var(--fg-1);
    max-width: 18ch; margin: 0 0 16px;
  }
  .contact-line em { color: var(--accent); font-style: italic; }
  .contact-sub { font-size: 17px; color: var(--fg-2); line-height: 1.65; max-width: 58ch; margin: 0 0 22px; }
  .contact-links {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    font-family: var(--font-mono); font-size: 15px;
  }
  .contact-links a {
    color: var(--fg-1); text-decoration: none;
    transition: color var(--dur-fast) var(--ease);
  }
  .contact-links a:hover { color: var(--accent); }
  .contact-cta { margin-top: 22px; }

  /* =================================================================
     Footer
     ================================================================= */
  .footer { border-top: 1px solid var(--border-1); padding: 20px 0; }
  .footer-inner {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 12px; color: var(--fg-3);
    gap: 20px; flex-wrap: wrap;
  }
  .footer-right { display: flex; gap: 18px; }
  .footer-right a { color: var(--fg-2); text-decoration: none; }
  .footer-right a:hover { color: var(--fg-1); }

  /* =================================================================
     Terminal FAB + modal
     ================================================================= */
  .term-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 60;
    width: 48px; height: 48px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--border-2);
    cursor: pointer; color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--dur-fast) var(--ease);
    box-shadow: var(--shadow-fab);
  }
  .term-fab:hover { background: var(--accent); color: var(--bg); transform: translateY(-2px); }
  .term-fab-prompt { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }

  .term-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; animation: term-fade 200ms var(--ease);
  }
  @keyframes term-fade { from { opacity: 0; } to { opacity: 1; } }
  /* Drag wrapper. Carries the translate so .term keeps its pop-in animation
     (an animated transform would otherwise override an inline one). */
  .term-shell {
    display: flex;
    width: 100%; max-width: 720px;
    height: 480px; max-height: 80vh;
  }
  .term-shell.is-dragging { will-change: transform; }

  /* A terminal is dark in both modes. Re-declaring the tokens here pins the
     whole subtree — every child inherits these instead of the root's. */
  .term {
    --surface-2: #1a1a1f;
    --surface-3: #212128;
    --border-1:  #232329;
    --border-2:  #303039;
    --fg-1:      #f5f5f5;
    --fg-2:      #a3a3a3;
    --fg-3:      #666666;
    --accent:      var(--accent-bright);
    --accent-glow: color-mix(in srgb, var(--accent-bright) 45%, transparent);

    width: 100%; height: 100%;   /* .term-shell owns the sizing */
    background: #0f0f0f; border: 1px solid var(--border-2);
    border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px -10px rgba(0,0,0,0.6);
    animation: term-pop 220ms var(--ease);
  }
  @keyframes term-pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .term-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border-1);
    cursor: grab;
    user-select: none; -webkit-user-select: none;
    touch-action: none;   /* let pointermove drag instead of scrolling the page */
  }
  .term-shell.is-dragging .term-head { cursor: grabbing; }
  /* Traffic lights — real buttons. Glyphs stay hidden until the group
     is hovered, the way a native title bar behaves. */
  .term-dots { display: flex; gap: 7px; align-items: center; }
  .term-dot {
    width: 12px; height: 12px; padding: 0; border: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; -webkit-appearance: none; appearance: none;
    font-family: var(--font-mono); font-size: 9px; line-height: 1;
    color: rgba(0, 0, 0, 0.55);
    transition: filter var(--dur-fast) var(--ease);
  }
  .term-dot span { opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
  .term-dots:hover .term-dot span { opacity: 1; }
  .term-dot:hover { filter: brightness(1.15); }
  .term-dot:active { filter: brightness(0.85); }
  .term-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .term-dot-close { background: #ff5f56; }
  .term-dot-min   { background: #ffbd2e; }
  .term-dot-max   { background: #27c93f; }

  /* Minimized — roll up to just the title bar. */
  .term-shell.is-min { height: auto; max-height: none; }
  .term-shell.is-min .term { height: auto; }
  .term-shell.is-min .term-body { display: none; }

  /* Maximized — near-fullscreen, re-centred by the click handler. */
  .term-shell.is-max {
    max-width: min(1400px, calc(100vw - 48px));
    width: calc(100vw - 48px);
    height: calc(100vh - 48px); max-height: none;
  }
  .term-title { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }
  .term-body {
    flex: 1; padding: 14px 16px; overflow-y: auto;
    font-family: var(--font-mono); font-size: 14px; line-height: 1.65; color: var(--fg-1);
  }
  .term-line { white-space: pre-wrap; word-break: break-word; }
  .term-cmd { color: var(--fg-1); }
  .term-cmd .term-prompt { color: var(--accent); margin-right: 8px; }
  .term-sys { color: var(--fg-3); }
  .term-input-line { display: flex; align-items: center; gap: 8px; }
  .term-prompt { color: var(--accent); flex-shrink: 0; }
  .term-input {
    flex: 1; background: transparent; border: 0; outline: 0;
    font-family: inherit; font-size: inherit; color: var(--fg-1);
    padding: 0; min-width: 0;
  }
  .term-caret { color: var(--fg-1); animation: blink 1.05s steps(2) infinite; }

  /* Snake (inside the terminal) -------------------------------------- */
  .snake-wrap { display: flex; flex-direction: column; gap: 10px; }
  .snake-bar {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 13px; color: var(--fg-2);
    padding-bottom: 8px; border-bottom: 1px dashed var(--border-1);
  }
  .snake-score b { color: var(--accent); font-weight: 500; margin-left: 4px; }
  .snake-hint { color: var(--fg-3); }
  .snake-grid {
    font-family: var(--font-mono); font-size: 15px; line-height: 1.15;
    letter-spacing: 0.18em; color: var(--accent);
    margin: 0; padding: 8px 0; background: transparent; border: 0;
    text-shadow: 0 0 8px var(--accent-glow); white-space: pre;
  }
  .snake-over {
    text-align: center; font-family: var(--font-mono); font-size: 14px;
    color: var(--hot); padding: 14px 0 6px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .snake-over-hint { color: var(--fg-2); font-size: 12px; margin-top: 4px; }

  /* =================================================================
     CRT mode (Konami easter egg)
     ================================================================= */
  body.crt-mode { background: #001a00 !important; }
  body.crt-mode #root { filter: hue-rotate(70deg) saturate(2.4) brightness(1.05) contrast(1.15); }
  body.crt-mode #root,
  body.crt-mode #root * {
    font-family: 'Geist Mono', 'JetBrains Mono', 'SF Mono', Menlo, monospace !important;
    text-shadow: 0 0 1px currentColor, 0 0 6px rgba(0, 255, 80, 0.4);
  }
  body.crt-mode::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
    background: repeating-linear-gradient(to bottom,
      rgba(0, 255, 80, 0.06) 0, rgba(0, 255, 80, 0.06) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: screen;
  }
  body.crt-mode::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 998;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.55) 100%);
  }
  @keyframes crt-flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.97; } }
  body.crt-mode #root { animation: crt-flicker 110ms infinite; }
  @media (prefers-reduced-motion: reduce) { body.crt-mode #root { animation: none; } }

  .crt-banner {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: #001a00; border: 1px solid #00ff50; border-radius: 4px;
    padding: 8px 16px;
    font-family: 'Geist Mono', monospace; font-size: 13px;
    color: #00ff50; text-shadow: 0 0 6px #00ff50;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 0 24px rgba(0, 255, 80, 0.35); letter-spacing: 0.08em;
  }
  .crt-banner-dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: #00ff50; box-shadow: 0 0 8px #00ff50;
    animation: blink 1.05s steps(2) infinite;
  }
  .crt-banner a { color: #00ff50; cursor: pointer; text-decoration: underline; }
</style>
</head>
