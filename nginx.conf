server {
    listen 80;
    index index.html;

    # Emit relative Location headers. Behind the Cloudflare tunnel the origin
    # only ever sees http://, so absolute redirects would downgrade the
    # visitor from https to http on the way to /nahush/.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    location = / {
        return 301 /nahush/;
    }

    location = /nahush {
        return 301 /nahush/;
    }

    location /nahush/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /nahush/index.html;

        # index.html, data.js and the .jsx files are compiled in the browser by
        # Babel, so they must all come from the same deploy. Cloudflare caches
        # .js by default but not .jsx, which silently pairs a stale data.js
        # with fresh components (ReferenceError: SOCIALS is not defined).
        # no-cache still allows 304s -- it forces revalidation, not refetching.
        add_header Cache-Control "no-cache";
    }
}
