server {
    listen 80;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    location = / {
        return 301 /nahush/;
    }

    location = /nahush {
        return 301 /nahush/;
    }

    location /nahush/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /nahush/index.html;
    }
}
