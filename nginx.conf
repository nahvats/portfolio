server {
    listen 80;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    location = / {
        return 301 /nahush/;
    }

    location = /nahush {
        return 301 /nahush/;
    }

    location /nahush/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /nahush/index.html;

        # Without an origin Cache-Control, Cloudflare applies its own 4h TTL
        # to .js/.css/.png/.pdf (but not .html/.jsx), so a deploy could leave
        # new markup paired with hours-old content, styles, or images.
        #
        # "no-cache" does not mean "don't store" — it means "revalidate before
        # use". Unchanged files return 304, so the edge still serves them fast.
        # If an asset ever gets large enough to matter, give it a versioned
        # filename and a long max-age rather than weakening this.
        add_header Cache-Control "no-cache" always;
    }
}
